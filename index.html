    const sel = h('select', { 'aria-label': 'Giọng ' + ROLE_WANT[r].label, onchange: e => { Settings.voices[r] = e.target.value || null; saveSettings(); } }, voiceOpts(r));
    sel.value = Settings.voices[r] || '';
    return h('div', { class: 'field' }, h('label', { text: ROLE_WANT[r].label }),
      h('div', { class: 'row' }, sel, h('button', { class: 'btn ghost sm', type: 'button', text: '🔊 Thử', onclick: () => { Speech.stop(); Speech.say('Good morning. This is how this voice will sound in the test. Please listen carefully.', r); } })));
  });
  const rate = h('input', { type: 'range', min: '0.7', max: '1.2', step: '0.05', value: String(Settings.rate), oninput: e => { Settings.rate = Number(e.target.value); rv.textContent = Settings.rate.toFixed(2) + '×'; saveSettings(); } });
  const rv = h('span', { text: Settings.rate.toFixed(2) + '×' });
  const fs = h('input', { type: 'range', min: '14', max: '24', step: '1', value: String(Settings.fs), oninput: e => { Settings.fs = Number(e.target.value); saveSettings(); applyTheme(); } });
  const theme = h('select', { 'aria-label': 'Giao diện', onchange: e => { Settings.theme = e.target.value; saveSettings(); applyTheme(); } },
    [['auto', 'Tự động theo thiết bị'], ['light', 'Sáng'], ['dark', 'Tối']].map(([v, t]) => h('option', { value: v, text: t })));
  theme.value = Settings.theme;
  const node = h('div', { class: 'wrap' }, h('h1', { text: 'Cài đặt' }),
    h('div', { class: 'panel' }, h('h2', { text: 'Giao diện' }),
      h('div', { class: 'field' }, h('label', { text: 'Chế độ màu' }), theme),
      h('div', { class: 'field' }, h('label', { text: 'Cỡ chữ câu hỏi / bài đọc' }), h('div', { class: 'range' }, fs)),
      h('div', { class: 'field' }, h('label', { text: 'Tên thí sinh (hiện trên kết quả in)' }), h('input', { type: 'text', value: Settings.name || '', placeholder: 'Họ và tên', oninput: e => { Settings.name = e.target.value; saveSettings(); } }))),
    h('div', { class: 'panel' }, h('h2', { text: 'Giọng đọc phần Listening' }),
      h('p', { class: 'muted small', text: Speech.voices.length ? `Tìm thấy ${Speech.voices.length} giọng tiếng Anh trên thiết bị. Chọn giọng "Natural/Neural" (Edge) hoặc "Google UK English" để nghe giống người thật nhất.` : 'Chưa tìm thấy giọng tiếng Anh. Trên Windows: Settings → Time & Language → Speech để cài thêm; hoặc dùng Microsoft Edge.' }),
      h('div', { class: 'field' }, h('label', { text: 'Tốc độ đọc' }), h('div', { class: 'range' }, rate, rv)),
      voiceRows),
    h('div', { class: 'row' }, h('button', { class: 'btn accent', type: 'button', text: 'Xong', onclick: homeView })));
  View.mount(node); Top.set({ title: 'Cài đặt', items: navButtons() });
}

/* ---------------- HƯỚNG DẪN ---------------- */
function rangesFromTable(table) { return table.filter(r => r[1] >= 3).map((r, i, a) => ({ band: r[1], from: r[0], to: i === 0 ? 40 : a[i - 1][0] - 1 })); }
function guideView() {
  const fmtTbl = rangesFromTable(LISTEN_TABLE), fmtR = rangesFromTable(READ_TABLE);
  const scoreTable = h('table', { class: 'grid2' }, h('thead', {}, h('tr', {}, ['Band', 'Listening (đúng /40)', 'Academic Reading (đúng /40)'].map(t => h('th', { text: t })))),
    h('tbody', {}, fmtTbl.map((r, i) => h('tr', {}, h('td', {}, h('b', { text: fmtBand(r.band) })), h('td', { text: r.from === r.to ? r.from : `${r.from}–${r.to}` }),
      h('td', { text: (fmtR[i] ? (fmtR[i].from === fmtR[i].to ? fmtR[i].from : `${fmtR[i].from}–${fmtR[i].to}`) : '') })))));
  const descTable = (title, list) => h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', { text: title }),
    h('div', { style: { overflowX: 'auto' } }, h('table', { class: 'grid2' }, h('thead', {}, h('tr', {}, [h('th', { text: 'Tiêu chí' }), ...[4, 5, 6, 7, 8, 9].map(b => h('th', { text: 'Band ' + b }))])),
      h('tbody', {}, list.map(c => h('tr', {}, h('td', {}, h('b', { text: c.name })), [4, 5, 6, 7, 8, 9].map(b => h('td', { class: 'small', text: c.d[b] }))))))));
  const node = h('div', { class: 'wrap' }, h('h1', { text: 'Hướng dẫn & thang điểm IELTS' }),
    h('div', { class: 'card' }, h('h3', { text: 'Cấu trúc bài thi IELTS Academic' }),
      h('table', { class: 'grid2' }, h('thead', {}, h('tr', {}, ['Kỹ năng', 'Thời gian', 'Nội dung'].map(t => h('th', { text: t })))),
        h('tbody', {}, [['Listening', '≈ 30 phút nghe + thời gian chép đáp án', '4 section, 40 câu. Audio phát MỘT lần.'], ['Reading', '60 phút', '3 bài đọc, 40 câu. Không có thêm thời gian chép đáp án.'], ['Writing', '60 phút', 'Task 1 (≥150 từ, ≈20 phút) + Task 2 (≥250 từ, ≈40 phút). Task 2 chiếm 2/3 điểm.'], ['Speaking', '11–14 phút', '3 phần: giới thiệu & phỏng vấn, nói 1–2 phút theo thẻ gợi ý, thảo luận.']].map(r => h('tr', {}, r.map(c => h('td', { text: c }))))))),
    h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', { text: 'Bảng quy đổi điểm thô → Band (tham khảo)' }), scoreTable,
      h('p', { class: 'muted small', text: 'Bảng dựa trên mức quy đổi được công bố rộng rãi cho IELTS Academic; mỗi đề thật có thể chênh nhẹ ±1 câu. Band Overall = trung bình 4 kỹ năng, làm tròn: .25 → .5 và .75 → số nguyên kế tiếp.' })),
    descTable('Writing — mô tả tiêu chí (rút gọn)', DESCRIPTORS.W), descTable('Speaking — mô tả tiêu chí (rút gọn)', DESCRIPTORS.S),
    h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', { text: 'Về điểm tự động & âm thanh' }),
      h('ul', { style: { paddingLeft: '18px', lineHeight: 1.8, margin: 0 } },
        h('li', { html: '<b>Listening/Reading:</b> chấm đáp án tự động, chính xác theo đáp án đề.' }),
        h('li', { html: '<b>Writing/Speaking:</b> ước lượng bằng thuật toán đếm đặc điểm văn bản/giọng nói. Chỉ để tham khảo; hãy dùng bảng tự chấm hoặc nhờ giáo viên.' }),
        h('li', { html: '<b>Giọng đọc</b> do trình duyệt cung cấp. Dùng <b>Microsoft Edge</b> (giọng Natural) hoặc Chrome/Safari có giọng chất lượng cao để nghe gần với người thật. Có thể tải file mp3 riêng để thay giọng đọc.' }),
        h('li', { html: '<b>Speaking</b> cần micro và nên dùng Chrome/Edge để có bản ghi chữ. Hãy dùng tai nghe.' }),
        h('li', { html: 'Dữ liệu lưu ngay trên máy bạn (localStorage), không gửi lên máy chủ.' }))),
    h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn accent', type: 'button', text: 'Về trang chủ', onclick: homeView })));
  View.mount(node); Top.set({ title: 'Hướng dẫn', items: navButtons() });
}

/* ---------------- KHỞI ĐỘNG ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* bỏ qua */ } }
  $('#brand').addEventListener('click', () => guardLeave(homeView));
  homeView();
  Speech.load();
});

</script>
</body>
</html>
