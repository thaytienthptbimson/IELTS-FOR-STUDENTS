<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2354">
<title>IELTS Mock Test Studio — Luyện thi IELTS 4 kỹ năng</title>
<meta name="description" content="Ứng dụng luyện thi IELTS Listening, Reading, Writing, Speaking với giao diện mô phỏng bài thi trên máy tính và chấm band theo thang quốc tế.">
<!--
  Bản quyền thuộc về Thầy Tiến - GV Trường THPT Bỉm Sơn- Thanh Hóa
  Ứng dụng thuộc về số ĐT: 0943930787
-->
<style>
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface2:#f7f9fd; --ink:#0f1b33; --muted:#58698a; --line:#dbe3f1;
  --brand:#0a2354; --brand2:#143f91; --accent:#009e92; --accent2:#00c2b2; --accent-ink:#00695f;
  --warn:#e8890c; --bad:#d9363e; --good:#14925a; --focus:#2b6cff; --hl:#ffe98a;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 10px 28px rgba(15,27,51,.09);
  --fs:17px; --radius:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:"Georgia","Cambria","Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0a1222; --surface:#121d36; --surface2:#0f182e; --ink:#e7eefc; --muted:#9db0d3; --line:#243456;
  --brand:#07102a; --brand2:#1b3b80; --accent:#2dd4bf; --accent2:#5eead4; --accent-ink:#5eead4;
  --warn:#fbbf24; --bad:#ff6b73; --good:#34d399; --hl:#6b5a00;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5{line-height:1.25;margin:0 0 .5em}
a{color:var(--brand2)}
[data-theme="dark"] a{color:#8fb4ff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.78;letter-spacing:.6px;text-transform:uppercase}
.topbar .grow{flex:1}
.topctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 11px;font-weight:600;font-size:14px;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.26)}
.timer{font-family:var(--mono);font-weight:700;font-size:20px;background:rgba(0,0,0,.28);padding:4px 12px;border-radius:10px;min-width:92px;text-align:center}
.timer.warn{background:var(--warn);color:#1b1200;animation:pulse 1s infinite}
.timer.crit{background:var(--bad);color:#fff;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.examtitle{font-weight:700;font-size:15px;opacity:.95}

/* ---------- LAYOUT ---------- */
main{flex:1;width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 40px}
.footer{background:var(--brand);color:#c8d6f5;text-align:center;padding:16px 14px;font-size:13.5px;line-height:1.7}
.footer b{color:#fff}
.footer a{color:#9ee7de}

.hero{background:radial-gradient(1200px 400px at 85% -20%,rgba(0,194,178,.35),transparent 60%),linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:34px 34px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,4vw,40px);margin:0 0 8px;letter-spacing:-.5px}
.hero p{margin:0 0 18px;max-width:62ch;opacity:.92}
.hero>*{position:relative;z-index:1}
.hero .wave{position:absolute;right:-10px;bottom:-14px;opacity:.22;width:360px;max-width:50%;z-index:0;pointer-events:none}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:13px}

.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.skill{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding-top:24px}
.skill:before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c,var(--accent))}
.skill .ico{width:46px;height:46px;border-radius:13px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);display:grid;place-items:center;color:var(--c,var(--accent))}
.skill h3{margin:6px 0 0;font-size:20px}
.skill p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.skill .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.skill .last{font-weight:700;font-size:14px}
.sec-title{margin:30px 0 14px;font-size:22px;display:flex;align-items:center;gap:10px}
.sec-title:after{content:"";flex:1;height:1px;background:var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--brand2);color:#fff;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.accent{background:var(--accent);color:#fff}
[data-theme="dark"] .btn.accent{color:#04211d}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.light{background:#fff;color:var(--brand)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.btn.lg{padding:14px 24px;font-size:17px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.notice{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface));padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px}
.notice.info{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 9%,var(--surface))}
.notice.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{height:14px}

/* ---------- SETUP PANELS ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h2{font-size:22px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--surface2)}
.choice input{margin-top:5px;accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.choice b{display:block}
.choice span{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}
.field select,.field input[type=text],.field input[type=number]{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-width:220px}
.range{display:flex;align-items:center;gap:10px}
.range input{accent-color:var(--accent);flex:1;max-width:260px}

/* ---------- EXAM SHELL ---------- */
.exam{display:flex;flex-direction:column;min-height:calc(100vh - 56px)}
.exam-body{flex:1;padding:14px 18px 96px;max-width:1500px;margin:0 auto;width:100%}
.palette{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:8px 14px;display:flex;gap:14px;align-items:center;overflow-x:auto}
.pgroup{display:flex;align-items:center;gap:5px;padding-right:12px;border-right:1px solid var(--line);flex:none}
.pgroup:last-of-type{border-right:0}
.pgroup .plabel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-right:3px;cursor:pointer;background:none;border:0}
.pgroup.active .plabel{color:var(--accent-ink)}
.psum{border:1.5px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 10px;font-weight:700;font-size:12.5px}
.pgroup.active .psum{display:none}
.pgroup:not(.active) .qn{display:none}
.palette .endbtn{position:sticky;right:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0;position:relative}
.qn.done{background:var(--brand2);border-color:var(--brand2);color:#fff}
.qn.flag:after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.qn:hover{border-color:var(--accent)}
.palette .endbtn{margin-left:auto;flex:none}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:11px;font-weight:700;font-size:14.5px}
.tab.active{background:var(--brand2);border-color:var(--brand2);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed}

.audiobar{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:16px;padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;box-shadow:var(--shadow)}
.audiobar .state{flex:1;min-width:220px}
.audiobar .state b{display:block;font-size:16px}
.audiobar .state span{font-size:13px;opacity:.85}
.eq{display:flex;gap:3px;align-items:flex-end;height:30px}
.eq i{display:block;width:5px;background:var(--accent2);border-radius:3px;height:6px}
.eq.on i{animation:eq 0.9s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.12s}.eq.on i:nth-child(3){animation-delay:.28s}.eq.on i:nth-child(4){animation-delay:.05s}.eq.on i:nth-child(5){animation-delay:.34s}.eq.on i:nth-child(6){animation-delay:.2s}
@keyframes eq{0%,100%{height:5px}50%{height:28px}}
.progress{height:7px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;width:100%;margin-top:7px}
.progress>div{height:100%;background:var(--accent2);width:0;transition:width .3s linear}
.audiobar .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.audiobar .btn:hover{background:rgba(255,255,255,.3)}
.audiobar .range input{max-width:120px}

/* ---------- QUESTIONS ---------- */
.qblock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;font-size:var(--fs)}
.qhead{margin-bottom:10px}
.qrange{display:inline-block;background:var(--brand2);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px}
.instr{margin:8px 0 0;color:var(--muted);font-size:.9em;line-height:1.5}
.qtitle{margin:12px 0 8px;font-size:1.05em;color:var(--brand2)}
[data-theme="dark"] .qtitle{color:#8fb4ff}
.qrow{padding:9px 0;border-top:1px dashed var(--line);position:relative;scroll-margin-top:90px;scroll-margin-bottom:90px}
.qrow:first-of-type{border-top:0}
.qrow.hl{animation:flash 1.2s}
@keyframes flash{0%{background:var(--hl)}100%{background:transparent}}
.qtext{display:flex;gap:10px;align-items:baseline}
.qnum{flex:none;min-width:28px;height:28px;border-radius:8px;background:var(--surface2);border:1.5px solid var(--brand2);color:var(--brand2);font-weight:800;display:grid;place-items:center;font-size:.85em}
[data-theme="dark"] .qnum{color:#8fb4ff;border-color:#8fb4ff}
.flagbtn{margin-left:auto;flex:none;background:none;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.flagbtn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 0 38px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surface2);transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt .letter{font-weight:800;min-width:20px;color:var(--brand2)}
[data-theme="dark"] .opt .letter{color:#8fb4ff}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.optlist{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0 12px;background:var(--surface2);columns:2 260px;column-gap:24px;font-size:.95em}
.optrow{display:flex;gap:10px;padding:2px 0;break-inside:avoid}
.optrow b{min-width:26px;color:var(--brand2)}
[data-theme="dark"] .optrow b{color:#8fb4ff}
.gap{width:150px;max-width:100%;padding:5px 9px;border:1.5px solid var(--brand2);border-radius:8px;background:var(--surface);font-weight:600;text-align:center;font-size:.95em}
.gap::placeholder{color:var(--muted);font-weight:800;opacity:.9}
.gap:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);outline:0}
.fillline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:2}
.sel{padding:6px 9px;border:1.5px solid var(--brand2);border-radius:8px;background:var(--surface);min-width:92px;font-weight:700}
.notes-head{margin:12px 0 2px;font-weight:800;font-size:.98em;color:var(--ink)}
.matchrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.matchrow .qtxt{flex:1;min-width:180px}

/* review */
.qrow.ok{background:color-mix(in srgb,var(--good) 8%,transparent)}
.qrow.no{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.mark{font-weight:800;margin-left:6px}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}
.keyans{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:7px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);font-weight:800;font-size:.88em}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}

/* ---------- READING ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 22px;height:calc(100vh - 210px);overflow:auto}
.pane.q{background:transparent;border:0;padding:0 4px 0 0}
.passage{font-family:var(--serif);font-size:var(--fs);line-height:1.75}
.passage h2{font-family:var(--sans);font-size:1.5em;margin-bottom:2px}
.passage .sub{font-family:var(--sans);color:var(--muted);margin:0 0 14px;font-style:italic}
.passage p{margin:0 0 .95em}
.passage .pl{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:6px;background:var(--brand2);color:#fff;font-family:var(--sans);font-weight:800;font-size:.8em;margin-right:8px;vertical-align:1px}
mark.hl{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.hlbar{position:fixed;z-index:80;display:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:5px 7px;box-shadow:var(--shadow);gap:6px}
.hlbar button{border:0;background:transparent;color:inherit;font-weight:700;padding:4px 10px;border-radius:7px}
.hlbar button:hover{background:rgba(255,255,255,.18)}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

/* ---------- WRITING ---------- */
.wsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.wprompt{font-size:var(--fs)}
.wprompt .task{font-weight:700}
.chartbox{border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:8px;margin:12px 0;overflow:auto}
[data-theme="dark"] .chartbox{background:#f4f7fc}
.chartbox svg{display:block;width:100%;height:auto;min-width:420px}
table.dt{border-collapse:collapse;width:100%;font-size:.95em}
table.dt th,table.dt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.dt th{background:var(--surface2)}
.chartbox table.dt{color:#0f1b33}.chartbox table.dt th{background:#eef2fa}.chartbox table.dt th,.chartbox table.dt td{border-color:#cfd8ea}
textarea.essay{width:100%;min-height:calc(100vh - 330px);resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);font-family:var(--serif);font-size:var(--fs);line-height:1.7}
textarea.essay:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.wc{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700;flex-wrap:wrap;gap:8px}
.wc .ok{color:var(--good)}.wc .low{color:var(--bad)}

/* ---------- SPEAKING ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.examiner{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 20px}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(140deg,var(--brand2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 16%,transparent)}
.avatar.talk{animation:ring 1.1s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.bubble{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px 18px;font-size:1.15em;font-weight:600;max-width:560px}
.cue{border:2px solid var(--ink);border-radius:6px;padding:14px 18px;background:#fffdf3;color:#1a1a1a;text-align:left;max-width:520px;font-family:var(--serif);font-size:1.05em;box-shadow:4px 4px 0 rgba(0,0,0,.18)}
.cue ul{margin:6px 0 0 18px;padding:0}
.micbtn{width:92px;height:92px;border-radius:50%;border:0;background:var(--bad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(217,54,62,.4)}
.micbtn.rec{animation:ring2 1.2s infinite}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(217,54,62,.55)}100%{box-shadow:0 0 0 26px rgba(217,54,62,0)}}
.level{height:10px;background:var(--line);border-radius:99px;overflow:hidden;width:100%;max-width:340px}
.level>div{height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--warn),var(--bad));transition:width .08s}
.live{min-height:70px;max-height:160px;overflow:auto;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.95em;color:var(--muted);width:100%;text-align:left}

/* ---------- RESULTS ---------- */
.result-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.gauge{position:relative;width:170px;height:170px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .bandnum{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .bandnum b{font-size:46px;line-height:1;display:block}
.gauge .bandnum span{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

.crit ul{margin:6px 0 0;padding-left:18px;font-size:13.8px;color:var(--muted)}

details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
.transcript p{margin:.35em 0}
.transcript .sp{display:inline-block;min-width:92px;font-weight:800;color:var(--brand2);font-size:.9em}
.trline{white-space:pre-wrap;font-family:var(--serif);line-height:1.7}
audio{width:100%;margin:6px 0}
.hist-chart{width:100%;height:auto}

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') { for (const p in v) { if (p.startsWith('--')) e.style.setProperty(p, v[p]); else e.style[p] = v[p]; } }
    else if (k === 'value') e.value = v;
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

let _ac = null;
function beep(freq = 880, ms = 320, vol = 0.22) {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = 'sine'; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(vol, _ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, _ac.currentTime + ms / 1000);
    o.start(); o.stop(_ac.currentTime + ms / 1000 + 0.03);
  } catch (e) { /* không có WebAudio */ }
  return sleep(ms + 90);
}

const NOVELTY_RE = /bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|pipe organ|trinoids|whisper|zarvox|albert|jester|junior|kathy|ralph|superstar|organ|grandma|grandpa|rocko|shelley|flo\b|reed|sandy|eddy|wobble/i;

function voiceQuality(v) {
  const n = v.name.toLowerCase();
  if (/natural|neural|online|premium|enhanced/.test(n)) return { t: 'Rất tự nhiên', c: 3 };
  if (/google|siri|samantha|daniel|karen|moira|tessa|serena|ava|oliver/.test(n)) return { t: 'Tốt', c: 2 };
  return { t: 'Cơ bản', c: 1 };
}

const Speech = {
  supported: typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined',
  voices: [], gen: 0, paused: false, audioEl: null, assigned: {},

  load() {
    return new Promise(res => {
      if (!this.supported) return res();
      const get = () => { this.voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); if (this.voices.length) this.autoAssign(); };
      get();
      if (this.voices.length) return res();
      speechSynthesis.onvoiceschanged = () => { get(); res(); };
      setTimeout(() => { get(); res(); }, 1400);
    });
  },
  score(v, want) {
    const n = v.name.toLowerCase(), l = v.lang.replace('_', '-').toLowerCase();
    let s = 0;
    if (l.startsWith('en-' + want.acc.toLowerCase())) s += 40; else if (want.acc === 'AU' && (l.startsWith('en-us') || l.startsWith('en-ca'))) s += 22; else if (l.startsWith('en-')) s += 12;
    const q = voiceQuality(v).c; s += q * 18;
    if (/google/.test(n)) s += 6;
    const female = FEMALE_RE.test(n) || (/google us english/.test(n)), male = MALE_RE.test(n);
    if (want.g === 'f') { if (female && !male) s += 28; else if (male) s -= 45; } else { if (male) s += 28; else if (female) s -= 45; }
    if (NOVELTY_RE.test(n)) s -= 200;
    return s;
  },
  autoAssign() {
    /* F1, M1, M2 cùng xuất hiện trong một đoạn hội thoại nên BẮT BUỘC khác giọng nhau;
       F2 (độc thoại) và A (người dẫn) được phép dùng lại giọng tốt nhất nếu giọng khác kém hơn nhiều */
    const taken = new Set(); this.assigned = {};
    ['F1', 'M1', 'M2', 'F2', 'A'].forEach(role => {
      const hard = ['F1', 'M1', 'M2'].includes(role);
      const ranked = this.voices.map(v => ({ v, s: this.score(v, ROLE_WANT[role]) - (!hard && taken.has(v.voiceURI) ? 35 : 0) })).sort((a, b) => b.s - a.s);
      const pick = (hard ? ranked.find(x => !taken.has(x.v.voiceURI)) : null) || ranked[0];
      if (pick) { this.assigned[role] = pick.v; taken.add(pick.v.voiceURI); }
    });
  },
  voiceFor(role) {
    const uri = Settings.voices && Settings.voices[role];
    if (uri) { const v = this.voices.find(x => x.voiceURI === uri); if (v) return v; }
    return this.assigned[role] || this.voices[0] || null;
  },
  speakChunk(text, voice, rate, pitch) {
    return new Promise(res => {
      if (!this.supported) return res('end');
      let done = false, wd;
      const fin = r => { if (done) return; done = true; clearTimeout(wd); res(r); };
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
      u.rate = clamp(rate, 0.5, 1.6); u.pitch = clamp(pitch, 0.5, 1.5); u.volume = 1;
      u.onend = () => fin('end');
      u.onerror = e => fin(e && (e.error === 'interrupted' || e.error === 'canceled') ? 'cancel' : 'error');
      const est = Math.max(2500, text.length * 95 / Math.max(.5, rate) + 3000);
      wd = setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } fin('end'); }, est * 1.7);
      try { speechSynthesis.speak(u); } catch (e) { fin('error'); }
    });
  },
  chunk(t, max = 190) {
    const sents = (t.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [t]).map(s => s.trim()).filter(Boolean);
    const out = []; let cur = '';
    sents.forEach(s => {
      while (s.length > max) { let cut = s.lastIndexOf(' ', max); if (cut < 40) cut = max; if (cur) { out.push(cur); cur = ''; } out.push(s.slice(0, cut)); s = s.slice(cut).trim(); }
      if ((cur + ' ' + s).trim().length <= max) cur = (cur + ' ' + s).trim(); else { if (cur) out.push(cur); cur = s; }
    });
    if (cur) out.push(cur);
    return out;
  },
  /* đọc 1 đoạn văn bản bằng 1 vai; trả về false nếu bị huỷ */
  async say(text, role, o = {}) {
    const gen = this.gen, v = this.voiceFor(role), want = ROLE_WANT[role] || ROLE_WANT.A;
    const rate = (o.rate || 1) * Settings.rate * 0.95;
    const chunks = this.chunk(text);
    for (let i = 0; i < chunks.length;) {
      if (gen !== this.gen) return false;
      if (this.paused) { await sleep(120); continue; }
      const r = await this.speakChunk(chunks[i], v, rate, want.pitch);
      if (gen !== this.gen) return false;
      if (r === 'cancel' && this.paused) continue;
      if (r === 'cancel') { await sleep(60); }
      i++;
      if (o.onChunk) o.onChunk(chunks[i - 1].length);
    }
    return true;
  },
  /* đọc cả đoạn hội thoại; lines = [{s,t,say}], roleOf(s) → vai giọng */
  async playLines(lines, roleOf, o = {}) {
    const gen = this.gen;
    const total = lines.reduce((a, l) => a + (l.say || l.t).length, 0); let done = 0;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (o.onLine) o.onLine(i);
      const ok = await this.say(l.say || l.t, roleOf(l.s), { rate: o.rate, onChunk: n => { done += n; if (o.onProgress) o.onProgress(Math.min(1, done / total)); } });
      if (!ok || gen !== this.gen) return false;
      await this.wait(i < lines.length - 1 ? 520 : 0);
      if (gen !== this.gen) return false;
    }
    if (o.onProgress) o.onProgress(1);
    return true;
  },
  async wait(ms) { const gen = this.gen; let left = ms; while (left > 0) { if (gen !== this.gen) return false; if (!this.paused) left -= 100; await sleep(100); } return true; },
  playFile(url, o = {}) {
    return new Promise(res => {
      const gen = this.gen, a = new Audio(url); this.audioEl = a;
      a.playbackRate = clamp(Settings.rate, .7, 1.2);
      a.ontimeupdate = () => { if (o.onProgress && a.duration) o.onProgress(a.currentTime / a.duration); };
      a.onended = () => res(gen === this.gen);
      a.onerror = () => res(false);
      a.play().catch(() => res(false));
    });
  },
  pause() { this.paused = true; if (this.audioEl) this.audioEl.pause(); try { speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } },
  resume() { this.paused = false; if (this.audioEl) this.audioEl.play().catch(() => { }); },
  stop() { this.gen++; this.paused = false; if (this.audioEl) { try { this.audioEl.pause(); } catch (e) { /* bỏ qua */ } this.audioEl = null; } try { if (this.supported) speechSynthesis.cancel(); } catch (e) { /* bỏ qua */ } }
};

function makeTimer(seconds, onTick, onEnd) {
  const end = Date.now() + seconds * 1000; let stopped = false, id = null;
  const tick = () => {
    if (stopped) return;
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    onTick && onTick(left);
    if (left <= 0) { stopped = true; clearInterval(id); onEnd && onEnd(); }
  };
  id = setInterval(tick, 250); tick();
  return { stop() { stopped = true; clearInterval(id); }, left: () => Math.max(0, Math.round((end - Date.now()) / 1000)) };
}

   ctx = { ans, flags, onChange(n), onFlag(n), review:{res:{n:bool}} }
   ===================================================================== */
function renderBlocks(blocks, ctx) {
  const root = h('div', { class: 'blocks' });
  blocks.forEach(b => {
    const nums = b.items.filter(i => i.n).map(i => i.n);
    const box = h('section', { class: 'qblock' });
    box.append(h('div', { class: 'qhead' },
      h('span', { class: 'qrange', text: nums.length > 1 ? `Questions ${nums[0]}–${nums[nums.length - 1]}` : `Question ${nums[0]}` }),
      b.instr ? h('p', { class: 'instr', html: b.instr }) : null));
    if (b.title) box.append(h('h4', { class: 'qtitle', text: b.title }));
    if (b.type === 'match' && b.options) box.append(h('div', { class: 'optlist' }, b.options.map(o => h('div', { class: 'optrow' }, h('b', { text: o.k }), h('span', { text: o.t })))));
    b.items.forEach(it => box.append(renderItem(b, it, ctx)));
    root.append(box);
  });
  return root;
}

function setAns(ctx, n, v) { ctx.ans[n] = v; if (ctx.onChange) ctx.onChange(n, v); }

function renderItem(b, it, ctx) {
  if (it.head) return h('div', { class: 'notes-head', text: it.head });
  const n = it.n, rev = ctx.review, locked = !!rev;
  const ok = rev ? !!rev.res[n] : null;
  const row = h('div', { class: 'qrow' + (rev ? (ok ? ' ok' : ' no') : ''), id: 'q-' + n });
  const flagBtn = !locked && ctx.onFlag ? h('button', {
    class: 'flagbtn' + (ctx.flags && ctx.flags[n] ? ' on' : ''), type: 'button', title: 'Đánh dấu để xem lại', 'aria-label': 'Đánh dấu câu ' + n, text: '⚑',
    onclick: e => { const on = !(ctx.flags[n]); ctx.flags[n] = on; e.currentTarget.classList.toggle('on', on); ctx.onFlag(n); }
  }) : null;
  const keyText = () => (Array.isArray(it.answer) ? it.answer[0] : it.answer) + (Array.isArray(it.answer) && it.answer.length > 1 && b.type === 'fill' ? '' : '');
  const markEl = () => rev ? h('span', { class: 'mark ' + (ok ? 'ok' : 'no'), text: ok ? '✓' : '✗' }) : null;
  const keyEl = () => rev && !ok ? h('span', { class: 'keyans', title: Array.isArray(it.answer) ? 'Chấp nhận: ' + it.answer.join(' / ') : '', text: 'Đáp án: ' + keyText() }) : null;

  if (b.type === 'fill') {
    const inp = h('input', {
      class: 'gap', type: 'text', placeholder: String(n), autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Câu ' + n,
      value: ctx.ans[n] || '', disabled: locked, oninput: e => setAns(ctx, n, e.target.value)
    });
    row.append(h('div', { class: 'fillline' },
      it.before ? h('span', { text: it.before }) : null, inp, it.after ? h('span', { text: it.after }) : null, markEl(), keyEl(), flagBtn));
    return row;
  }
  if (b.type === 'match') {
    const sel = h('select', { class: 'sel', 'aria-label': 'Câu ' + n, disabled: locked, onchange: e => setAns(ctx, n, e.target.value) },
      h('option', { value: '', text: '—' }), b.options.map(o => h('option', { value: o.k, text: o.k })));
    sel.value = ctx.ans[n] || '';
    row.append(h('div', { class: 'matchrow' }, h('span', { class: 'qnum', text: n }), h('span', { class: 'qtxt', text: it.q }), sel, markEl(), keyEl(), flagBtn));
    return row;
  }
  /* mcq / tfng */
  row.append(h('div', { class: 'qtext' }, h('span', { class: 'qnum', text: n }), h('span', { text: it.q }), markEl(), keyEl(), flagBtn));
  const opts = h('div', { class: 'opts' + (b.type === 'tfng' ? ' inline' : '') });
  const choices = b.type === 'tfng' ? b.labels.map(l => ({ v: l, t: l })) : it.options.map((t, i) => ({ v: String.fromCharCode(65 + i), t }));
  choices.forEach(c => {
    const inp = h('input', { type: 'radio', name: 'q' + n, value: c.v, disabled: locked, onchange: () => setAns(ctx, n, c.v) });
    if (ctx.ans[n] === c.v) inp.checked = true;
    let cls = 'opt';
    if (rev) { if (norm(c.v) === norm(it.answer)) cls += ' right'; else if (ctx.ans[n] === c.v) cls += ' wrong'; }
    opts.append(h('label', { class: cls }, inp, b.type === 'tfng' ? h('span', { text: c.t }) : [h('span', { class: 'letter', text: c.v }), h('span', { text: c.t })]));
  });
  row.append(opts);
  return row;
}

function jumpToQuestion(n) {
  const el = document.getElementById('q-' + n); if (!el) return false;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl');
  const inp = $('input.gap, select, input[type=radio]', el); if (inp && inp.type !== 'radio') setTimeout(() => inp.focus({ preventScroll: true }), 350);
  return true;
}

/* ---------- Thanh số câu (palette) ---------- */
function buildPalette(groups, ctx, onJump, onEnd, endLabel = 'Nộp bài') {
  const bar = h('nav', { class: 'palette', 'aria-label': 'Danh sách câu hỏi' });
  groups.forEach(g => {
    const wrap = h('div', { class: 'pgroup', dataset: { key: g.key } });
    wrap.append(h('button', { class: 'plabel', type: 'button', text: g.label, onclick: () => onJump(g.from, g) }));
    wrap.append(h('button', { class: 'psum', type: 'button', 'aria-label': 'Mở ' + g.label, onclick: () => onJump(g.from, g) }));
    for (let n = g.from; n <= g.to; n++) wrap.append(h('button', { class: 'qn', type: 'button', text: n, dataset: { n }, 'aria-label': 'Đến câu ' + n, onclick: () => onJump(n, g) }));
    bar.append(wrap);
  });
  bar.append(h('button', { class: 'btn accent endbtn', type: 'button', text: endLabel, onclick: onEnd }));
  bar.refresh = (activeKey) => {
    $$('.qn', bar).forEach(b => { const n = +b.dataset.n; b.classList.toggle('done', hasAns(ctx.ans[n])); b.classList.toggle('flag', !!(ctx.flags && ctx.flags[n])); });
    if (activeKey != null) $$('.pgroup', bar).forEach(g => g.classList.toggle('active', g.dataset.key === String(activeKey)));
    groups.forEach(g => {
      let done = 0, fl = 0; for (let n = g.from; n <= g.to; n++) { if (hasAns(ctx.ans[n])) done++; if (ctx.flags && ctx.flags[n]) fl++; }
      const s = $('.pgroup[data-key="' + g.key + '"] .psum', bar); if (s) s.textContent = `${done}/${g.to - g.from + 1}` + (fl ? ` ⚑${fl}` : '');
    });
  };
  return bar;
}

/* ---------- Chấm toàn bộ ---------- */
function gradeAll(blocksList, ans) {
  const all = []; blocksList.forEach(bl => flatten(bl).forEach(q => all.push(q)));
  all.sort((a, b) => a.n - b.n);
  const res = {}; let correct = 0; const byType = {};
  all.forEach(q => {
    const ok = isCorrect(q, ans[q.n]); res[q.n] = ok; if (ok) correct++;
    byType[q.type] = byType[q.type] || { c: 0, t: 0 }; byType[q.type].t++; if (ok) byType[q.type].c++;
  });
  return { all, res, correct, total: all.length, byType };
}

      ], st.mode, v => st.mode = v)),

        { v: 'all', t: 'Cả 4 section (40 câu)', d: 'Tính band theo bảng quy đổi quốc tế.' },
        ...test.sections.map((s, i) => ({ v: String(i), t: s.title, d: s.topic + ' — câu ' + s.qFrom + '–' + s.qTo }))

          await Speech.say('Good morning. This is a short test of the voices you will hear in the listening test.', 'A');
          await Speech.say('Hello, and welcome. Can you hear me clearly?', 'F1');

function startListening(opts) {
  Speech.stop();
  const test = LISTENING_TESTS[0];
  const secs = opts.scope === 'all' ? [0, 1, 2, 3] : [Number(opts.scope)];
  const tok = L.tok + 1;
  Object.assign(L, { tok, test, mode: opts.mode, secs, ans: {}, flags: {}, cur: secs[0], startedAt: Date.now(), done: false });
  const exam = L.mode === 'exam';
  const ctx = { ans: L.ans, flags: L.flags, onChange: () => pal.refresh(L.cur), onFlag: () => pal.refresh(L.cur) };

  /* --- audio bar --- */
  const eq = h('div', { class: 'eq', 'aria-hidden': 'true' }, [1, 2, 3, 4, 5, 6].map(() => h('i')));
  const stTitle = h('b', { text: 'Sẵn sàng' }), stSub = h('span', { text: '' });
  const prog = h('div', { style: { width: '0%' } });
  const stateBox = h('div', { class: 'state' }, stTitle, stSub, h('div', { class: 'progress' }, prog));
  const audiobar = h('div', { class: 'audiobar' }, eq, stateBox);
  const setStatus = (t, s, o = {}) => { stTitle.textContent = t; stSub.textContent = s || ''; eq.classList.toggle('on', !!o.eq); if (o.prog != null) prog.style.width = Math.round(o.prog * 100) + '%'; };
  const setProg = p => { prog.style.width = Math.round(p * 100) + '%'; };

  const tabs = h('div', { class: 'tabs' }, secs.map(i => h('button', { class: 'tab', type: 'button', dataset: { i }, text: test.sections[i].title, onclick: () => onTab(i) })));
  const qbox = h('div', { id: 'qbox' });
  const trBox = h('div', {});

  const pal = buildPalette(secs.map(i => ({ key: i, label: 'S' + (i + 1), from: test.sections[i].qFrom, to: test.sections[i].qTo })), ctx,
    (n, g) => { if (L.cur !== g.key) showSection(g.key); setTimeout(() => jumpToQuestion(n), 30); },
    () => submit(false));

  function showSection(i) {
    L.cur = i; const sec = test.sections[i];
    qbox.replaceChildren(h('p', { class: 'muted small', text: sec.topic }), renderBlocks(sec.blocks, ctx));
    $$('.tab', tabs).forEach(t => t.classList.toggle('active', +t.dataset.i === i));
    pal.refresh(i);
    if (!exam) {
      trBox.replaceChildren(h('details', {}, h('summary', { text: 'Xem lời thoại (transcript) — chỉ dùng khi luyện tập' }),
        h('div', { class: 'transcript' }, sec.script.map(l => h('p', {}, h('span', { class: 'sp', text: (sec.speakers[l.s] || {}).name || '' }), l.t)))));
    }
  }
  function onTab(i) {
    if (!exam && i !== L.cur) { L.tok++; Speech.stop(); setStatus('Sẵn sàng', 'Nhấn ▶ để nghe ' + test.sections[i].title, { eq: false, prog: 0 }); pauseBtn && (pauseBtn.textContent = '⏸ Tạm dừng'); }
    showSection(i);
  }

  async function countdown(sec, label, myTok) {
    const end = Date.now() + sec * 1000;
    for (;;) {
      if (L.tok !== myTok) return false;
      const left = Math.ceil((end - Date.now()) / 1000);
      if (left <= 0) return true;
      setStatus(label, `Còn ${left} giây`, { eq: false, prog: 1 - left / sec });
      await sleep(250);
    }
  }
  async function playSection(i, myTok, showProg = true) {
    const sec = test.sections[i];
    if (L.custom[i]) return Speech.playFile(L.custom[i], { onProgress: showProg ? setProg : null });
    return Speech.playLines(sec.script, s => (sec.speakers[s] || { role: 'A' }).role, { onProgress: showProg ? setProg : null, rate: 1 });
  }

  /* --- luồng THI THẬT --- */
  async function examFlow() {
    const myTok = L.tok;
    const alive = () => L.tok === myTok;
    for (let k = 0; k < secs.length; k++) {
      const i = secs[k], sec = test.sections[i], last = k === secs.length - 1;
      showSection(i);
      if (L.custom[i]) {
        setStatus(sec.title + ' — đang phát', 'Âm thanh tải lên · chỉ phát một lần', { eq: true, prog: 0 });
        if (!(await playSection(i, myTok)) || !alive()) return;
        continue;
      }
      setStatus(sec.title, 'Người dẫn đang giới thiệu…', { eq: true, prog: 0 });
      await Speech.say(sec.announce, 'A'); if (!alive()) return;
      if (!(await countdown(30, sec.title + ' — đọc trước câu hỏi', myTok))) return;
      await beep(); if (!alive()) return;
      setStatus(sec.title + ' — đang phát', 'Chỉ phát một lần. Hãy ghi đáp án trực tiếp lên màn hình.', { eq: true, prog: 0 });
      if (!(await playSection(i, myTok)) || !alive()) return;
      await Speech.wait(500); if (!alive()) return;
      if (!last) {
        setStatus(sec.title, 'Người dẫn đang thông báo…', { eq: true });
        await Speech.say(`That is the end of ${sec.title}. You now have thirty seconds to check your answers.`, 'A'); if (!alive()) return;
        if (!(await countdown(30, 'Kiểm tra lại ' + sec.title, myTok))) return;
        await beep(660, 220); if (!alive()) return;
      } else {
        setStatus(sec.title, 'Người dẫn đang thông báo…', { eq: true });
        await Speech.say('That is the end of the test. You now have two minutes to check your answers.', 'A'); if (!alive()) return;
        if (!(await countdown(120, 'Kiểm tra lại toàn bộ bài', myTok))) return;
      }
    }
    if (alive()) { await beep(660, 400); submit(true); }
  }

  /* --- LUYỆN TẬP --- */
  let pauseBtn = null;
  async function practicePlay() {
    Speech.stop(); const myTok = ++L.tok; const sec = test.sections[L.cur];
    if (pauseBtn) pauseBtn.textContent = '⏸ Tạm dừng';
    setStatus(sec.title + ' — đang phát', 'Luyện tập: có thể tạm dừng / nghe lại', { eq: true, prog: 0 });
    const ok = await playSection(L.cur, myTok);
    if (ok && L.tok === myTok) setStatus('Đã phát xong ' + sec.title, 'Bạn có thể nghe lại hoặc xem lời thoại bên dưới.', { eq: false, prog: 1 });
  }

  const controls = h('div', { class: 'row' });
  if (!exam) {
    pauseBtn = h('button', { class: 'btn sm', type: 'button', text: '⏸ Tạm dừng', onclick: () => { if (Speech.paused) { Speech.resume(); pauseBtn.textContent = '⏸ Tạm dừng'; eq.classList.add('on'); } else { Speech.pause(); pauseBtn.textContent = '▶ Tiếp tục'; eq.classList.remove('on'); } } });
    const rate = h('input', { type: 'range', min: '0.7', max: '1.2', step: '0.05', value: String(Settings.rate), 'aria-label': 'Tốc độ', oninput: e => { Settings.rate = Number(e.target.value); saveSettings(); } });
    controls.append(h('button', { class: 'btn sm', type: 'button', text: '▶ Phát', onclick: practicePlay }), pauseBtn,
      h('button', { class: 'btn sm', type: 'button', text: '⟲ Nghe lại', onclick: practicePlay }),
      h('label', { class: 'range small' }, 'Tốc độ', rate));
    audiobar.append(controls);
  } else {
    audiobar.append(h('div', { class: 'small', style: { opacity: .85 }, text: '🎧 Chế độ thi thật: không tạm dừng, không nghe lại.' }));
  }

  const timer = timerNode();
  const clock = setInterval(() => { timer.textContent = fmtTime((Date.now() - L.startedAt) / 1000); }, 500);

  async function submit(auto) {
    if (L.done) return;
    if (!auto) {
      const un = secs.flatMap(i => { const s = test.sections[i]; return Array.from({ length: s.qTo - s.qFrom + 1 }, (_, k) => s.qFrom + k); }).filter(n => !hasAns(L.ans[n])).length;
      const ok = await confirmBox('Nộp bài Listening?', un ? `Còn <b>${un}</b> câu chưa trả lời. Sau khi nộp bạn không thể sửa.` : 'Bạn đã trả lời tất cả các câu. Nộp bài ngay?', 'Nộp bài', 'Làm tiếp');
      if (!ok) return;
    }
    L.done = true; L.tok++; Speech.stop();
    finishListening();
  }

  Top.set({ title: (exam ? 'THI THẬT · ' : 'LUYỆN TẬP · ') + 'Listening', items: [timer, ...fontTools()] });
  const examEl = h('div', { class: 'exam' }, h('div', { class: 'exam-body' }, audiobar, secs.length > 1 ? tabs : null, qbox, trBox), pal);
  View.mount(examEl);
  /* đăng ký dọn dẹp SAU khi mount (mount sẽ chạy leave() của màn hình cũ) */
  View.onLeave(() => { clearInterval(clock); L.tok++; window.onbeforeunload = null; });
  window.onbeforeunload = () => 'Bài thi đang diễn ra!';
  showSection(secs[0]);
  setStatus('Sẵn sàng', exam ? 'Bài thi sẽ tự động chạy từ phần giới thiệu.' : 'Nhấn ▶ Phát để nghe section đang chọn.', { eq: false, prog: 0 });
  if (exam) { setTimeout(() => { if (L.tok === tok) examFlow(); }, 600); }
}

function finishListening() {
  const test = L.test;
  const g = gradeAll(L.secs.map(i => test.sections[i].blocks), L.ans);
  const full = L.secs.length === 4;
  const band = rawToBand(g.correct, LISTEN_TABLE, full ? 40 : g.total);
  const entry = Hist.add({
    skill: 'L', title: 'Listening — ' + test.title + (full ? '' : ` (${test.sections[L.secs[0]].title})`), mode: L.mode,
    raw: g.correct, total: g.total, band, estimated: !full, byType: g.byType, ans: Object.assign({}, L.ans), res: g.res,
    ref: { test: test.id, secs: L.secs.slice() }, dur: Math.round((Date.now() - L.startedAt) / 1000)
  });
  afterSkill(entry);
}

const R = { tok: 0, test: null, ps: [0, 1, 2], ans: {}, flags: {}, cur: 0, startedAt: 0, done: false };

function setupHighlight(pane) {
  const bar = h('div', { class: 'hlbar', role: 'toolbar' });
  let range = null;
  const hide = () => { bar.style.display = 'none'; };
  const paraOf = n => { while (n && n !== pane) { if (n.nodeType === 1 && n.tagName === 'P') return n; n = n.parentNode; } return null; };
  const check = () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !pane.contains(sel.anchorNode) || !pane.contains(sel.focusNode)) { hide(); return; }
    range = sel.getRangeAt(0).cloneRange();
    const r = range.getBoundingClientRect();
    bar.style.display = 'flex';
    bar.style.left = Math.max(8, r.left + r.width / 2 - 70) + 'px';
    bar.style.top = Math.max(64, r.top - 46) + 'px';
  };
  const apply = () => {
    if (!range) return;
    const a = paraOf(range.startContainer), b = paraOf(range.endContainer);
    if (!a || a !== b) { toast('Chỉ tô sáng trong cùng một đoạn văn.'); hide(); return; }
    try { const m = h('mark', { class: 'hl' }); m.appendChild(range.extractContents()); range.insertNode(m); } catch (e) { toast('Không thể tô sáng vùng chọn này.'); }
    window.getSelection().removeAllRanges(); hide();
  };
  const remove = () => {
    if (!range) return;
    $$('mark.hl', pane).forEach(m => { if (range.intersectsNode(m)) { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); } });
    window.getSelection().removeAllRanges(); hide();
  };
  bar.append(h('button', { type: 'button', text: '✎ Tô sáng', onmousedown: e => e.preventDefault(), onclick: apply }),
    h('button', { type: 'button', text: 'Xoá tô', onmousedown: e => e.preventDefault(), onclick: remove }));
  document.body.append(bar);
  pane.addEventListener('mouseup', () => setTimeout(check, 10));
  pane.addEventListener('touchend', () => setTimeout(check, 250));
  pane.addEventListener('scroll', hide);
  View.onLeave(() => bar.remove());
}

function renderPassage(p, idx) {
  return h('article', { class: 'passage', dataset: { p: idx } },
    h('h2', { text: p.title }), h('p', { class: 'sub', text: p.subtitle }),
    p.paras.map(x => h('p', {}, h('span', { class: 'pl', text: x.l }), x.t)));
}

function startReading(opts) {
  const test = READING_TESTS[0];
  const ps = opts.scope === 'all' ? [0, 1, 2] : [Number(opts.scope)];
  const tok = R.tok + 1;
  Object.assign(R, { tok, test, ps, ans: {}, flags: {}, cur: ps[0], startedAt: Date.now(), done: false });
  const ctx = { ans: R.ans, flags: R.flags, onChange: () => pal.refresh(R.cur), onFlag: () => pal.refresh(R.cur) };
  const totalSec = (ps.length === 3 ? 60 : 20) * 60;

  const passEls = {}, qEls = {};
  const leftPane = h('div', { class: 'pane', id: 'leftpane' });
  const rightPane = h('div', { class: 'pane q', id: 'rightpane' });
  ps.forEach(i => {
    passEls[i] = renderPassage(test.passages[i], i); passEls[i].hidden = true; leftPane.append(passEls[i]);
    qEls[i] = h('div', {}, h('p', { class: 'muted small', text: `Bạn nên dành khoảng 20 phút cho Passage ${i + 1}. Câu ${test.passages[i].qFrom}–${test.passages[i].qTo}.` }), renderBlocks(test.passages[i].blocks, ctx));
    qEls[i].hidden = true; rightPane.append(qEls[i]);
  });
  const tabs = h('div', { class: 'tabs' }, ps.map(i => h('button', { class: 'tab', type: 'button', dataset: { i }, text: 'Passage ' + (i + 1), onclick: () => showPassage(i) })));
  const tools = h('div', { class: 'tools' }, ps.length > 1 ? tabs : null,
    h('button', { class: 'btn ghost sm', type: 'button', text: 'Xoá mọi tô sáng (bài này)', onclick: () => { $$('mark.hl', passEls[R.cur]).forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); }); } }));

  const pal = buildPalette(ps.map(i => ({ key: i, label: 'P' + (i + 1), from: test.passages[i].qFrom, to: test.passages[i].qTo })), ctx,
    (n, g) => { if (R.cur !== g.key) showPassage(g.key); setTimeout(() => jumpToQuestion(n), 30); }, () => submit(false));

  function showPassage(i) {
    R.cur = i;
    ps.forEach(k => { passEls[k].hidden = k !== i; qEls[k].hidden = k !== i; });
    $$('.tab', tabs).forEach(t => t.classList.toggle('active', +t.dataset.i === i));
    leftPane.scrollTop = 0; rightPane.scrollTop = 0;
    pal.refresh(i);
  }

  async function submit(auto) {
    if (R.done) return;
    if (!auto) {
      const un = ps.flatMap(i => { const p = test.passages[i]; return Array.from({ length: p.qTo - p.qFrom + 1 }, (_, k) => p.qFrom + k); }).filter(n => !hasAns(R.ans[n])).length;
      const ok = await confirmBox('Nộp bài Reading?', un ? `Còn <b>${un}</b> câu chưa trả lời. Sau khi nộp bạn không thể sửa.` : 'Bạn đã trả lời tất cả các câu. Nộp bài ngay?', 'Nộp bài', 'Làm tiếp');
      if (!ok) return;
    }
    R.done = true; if (R.timer) R.timer.stop();
    finishReading();
  }

  const timer = timerNode();
  Top.set({ title: 'THI THẬT · Reading', items: [timer, ...fontTools()] });
  const examEl = h('div', { class: 'exam' }, h('div', { class: 'exam-body' }, tools, h('div', { class: 'split' }, leftPane, rightPane)), pal);
  View.mount(examEl);
  setupHighlight(leftPane); /* đăng ký dọn dẹp phải đặt SAU mount */
  R.timer = makeTimer(totalSec, left => Top.setTimer(left), () => { toast('Hết giờ! Hệ thống tự nộp bài.', 4000); submit(true); });
  View.onLeave(() => { if (R.timer) R.timer.stop(); window.onbeforeunload = null; });
  window.onbeforeunload = () => 'Bài thi đang diễn ra!';
  showPassage(ps[0]);
}

function finishReading() {
  const test = R.test;
  const g = gradeAll(R.ps.map(i => test.passages[i].blocks), R.ans);
  const full = R.ps.length === 3;
  const band = rawToBand(g.correct, READ_TABLE, full ? 40 : g.total);
  const entry = Hist.add({
    skill: 'R', title: 'Reading — ' + test.title + (full ? '' : ` (Passage ${R.ps[0] + 1})`), mode: 'exam',
    raw: g.correct, total: g.total, band, estimated: !full, byType: g.byType, ans: Object.assign({}, R.ans), res: g.res,
    ref: { test: test.id, ps: R.ps.slice() }, dur: Math.round((Date.now() - R.startedAt) / 1000)
  });

}

/* =====================================================================
   WRITING — Task 1 (biểu đồ vẽ bằng SVG) + Task 2, đếm từ, bộ phân tích
   ước lượng band theo 4 tiêu chí (heuristic — chỉ để tham khảo)
   ===================================================================== */
const W = { tok: 0, scope: 'full', t1: null, t2: null, text: { 1: '', 2: '' }, cur: 1, startedAt: 0, done: false, timer: null };

const CHART_COLORS = ['#1f6fd6', '#e8590c', '#2f9e44', '#9c36b5'];
function chartSVG(kind, c) {
  const Wd = 680, Ht = 390, m = { l: 58, r: 24, t: 50, b: 78 }, iw = Wd - m.l - m.r, ih = Ht - m.t - m.b, yMax = c.yMax, step = yMax <= 60 ? 10 : 20;

  if (gErr) nG.push(`Phát hiện ${gErr} lỗi mẫu thường gặp (${errRate.toFixed(1)}/100 từ) — xem danh sách bên dưới.`); else nG.push('Không phát hiện lỗi mẫu thường gặp (bộ kiểm tra chỉ bắt được một số lỗi).');
  if (avgS < 10) { gra -= 0.5; nG.push('Câu trung bình quá ngắn.'); } else if (avgS > 35) { gra -= 0.5; nG.push('Câu quá dài, dễ sai cấu trúc.'); }
  out.bands.GRA = clamp(halfStep(gra), 4, 7.5);

  out.spelling = spelling; out.grammar = gram;
  out.stats = { wc, sentences: sentences.length, paragraphs: paragraphs.length, avgS: +avgS.toFixed(1), guiraud: +guiraud.toFixed(1), linkers: linkerSet.size, complexPct: Math.round(complexRatio * 100), topWords };
  out.overall = roundBand((out.bands.TA + out.bands.CC + out.bands.LR + out.bands.GRA) / 4);
  return out;
}

function finishWriting() {
  const res = {}; const tasks = W.tasks;
  tasks.forEach(k => { res[k] = analyzeWriting(W.text[k], k, k === 1 ? W.t1 : W.t2); });
  const b1 = res[1] && !res[1].tooShort ? res[1].overall : null, b2 = res[2] && !res[2].tooShort ? res[2].overall : null;
  let band = null;
  if (tasks.length === 2) band = (b1 != null && b2 != null) ? roundBand((b1 + 2 * b2) / 3) : (b2 != null ? b2 : b1);
  else band = tasks[0] === 1 ? b1 : b2;
  const entry = Hist.add({
    skill: 'W', title: 'Writing — ' + (tasks.length === 2 ? 'Task 1 + Task 2' : 'Task ' + tasks[0]), mode: 'exam', band, auto: true,
    texts: { 1: W.text[1], 2: W.text[2] }, prompts: { t1: W.t1 && tasks.includes(1) ? W.t1.id : null, t2: W.t2 && tasks.includes(2) ? W.t2.id : null }, tasks, analysis: res,
    dur: Math.round((Date.now() - W.startedAt) / 1000)
  });
  Store.set('draft', null);
  afterSkill(entry);
}

/* =====================================================================
   PHÂN TÍCH SPEAKING (heuristic) — chỉ để tham khảo
   ===================================================================== */
const IDIOMS = ['piece of cake', 'once in a blue moon', 'under the weather', 'break the ice', 'at the end of the day', 'as far as i know', 'it depends', 'on the other hand', 'to be honest', 'by the way', 'in the long run', 'a lot of', 'keep in touch', 'get along with', 'look forward to', 'come across', 'figure out', 'make sense', 'take for granted', 'in the same boat', 'hit the books', 'my cup of tea', 'a blessing in disguise'];
const SPOKEN_LINKERS = ['because', 'but', 'so', 'however', 'also', 'for example', 'for instance', 'although', 'while', 'whereas', 'in addition', 'on the other hand', 'firstly', 'secondly', 'finally', 'as a result', 'therefore', 'besides', 'moreover', 'in my opinion', 'i think', 'i believe', 'to be honest', 'overall', 'in fact', 'actually'];

function analyzeSpeaking(answers) {
  const sc = answers.filter(a => a.part >= 1 && a.part <= 3);
  const out = { bands: { FC: null, LR: null, GRA: null, P: null }, notes: { FC: [], LR: [], GRA: [], P: [] }, stats: {}, overall: null, grammar: [] };
  const text = sc.map(a => a.text || '').join(' ').toLowerCase();
  const words = text.match(/[a-z]+(?:'[a-z]+)?/g) || [];
  const wc = words.length;
  const totalDur = sc.reduce((a, b) => a + (b.dur || 0), 0);
  const voiced = sc.reduce((a, b) => a + (b.voicedMs || 0), 0) / 1000;
  const pauses = sc.reduce((a, b) => a + (b.pauses || 0), 0);
  const longest = Math.max(0, ...sc.map(a => a.longest || 0)) / 1000;
  const hasASR = wc >= 25;
  const p1 = sc.filter(a => a.part === 1), p2 = sc.filter(a => a.part === 2), p3 = sc.filter(a => a.part === 3);
  const cw = arr => arr.length ? arr.reduce((a, b) => a + ((b.text || '').match(/[A-Za-z']+/g) || []).length, 0) / arr.length : 0;
  out.stats = { answers: sc.length, totalDur: Math.round(totalDur), voiced: Math.round(voiced), wc, p2dur: p2.length ? Math.round(p2[0].dur) : 0, pauses, longest: +longest.toFixed(1) };

  if (!sc.length) { out.none = true; out.notes.FC.push('Chưa có câu trả lời nào được ghi nhận.'); return out; }
  const p2dur = p2.length ? p2[0].dur : 0;

  /* ---- FC ---- */
  let fc = 5.5; const nF = out.notes.FC;
  if (p2.length) { if (p2dur >= 100) { fc += 1; nF.push(`Part 2 nói được ${Math.round(p2dur)} giây — rất tốt (mục tiêu 90–120 giây).`); } else if (p2dur >= 75) { fc += 0.5; nF.push(`Part 2 nói ${Math.round(p2dur)} giây — khá, cố nói đủ gần 2 phút.`); } else if (p2dur < 45) { fc -= 1; nF.push(`Part 2 chỉ nói ${Math.round(p2dur)} giây — quá ngắn, hãy dùng gợi ý 4 ý của thẻ để nói dài hơn.`); } else nF.push(`Part 2 nói ${Math.round(p2dur)} giây.`); } else { fc -= 0.5; nF.push('Không có bản ghi Part 2.'); }
  if (hasASR) {
    const wpm = wc / (totalDur / 60);
    out.stats.wpm = Math.round(wpm);
    if (wpm >= 110) { fc += 0.5; nF.push(`Tốc độ nói ~${Math.round(wpm)} từ/phút — tự nhiên.`); } else if (wpm < 70) { fc -= 1; nF.push(`Tốc độ ~${Math.round(wpm)} từ/phút — hơi chậm, nhiều khoảng lặng.`); } else if (wpm < 90) { fc -= 0.5; nF.push(`Tốc độ ~${Math.round(wpm)} từ/phút — hơi chậm.`); } else nF.push(`Tốc độ ~${Math.round(wpm)} từ/phút.`);
    const fillers = FILLERS.reduce((a, f) => a + countRx(text, new RegExp('\\b' + rxEsc(f) + '\\b', 'g')), 0);
    const fr = fillers / wc * 100; out.stats.fillers = fillers;
    if (fr > 8) { fc -= 1; nF.push(`Nhiều từ đệm (um, like, you know…): ${fillers} lần.`); } else if (fr > 4) { fc -= 0.5; nF.push(`Khá nhiều từ đệm (${fillers} lần).`); } else if (fr <= 2) { fc += 0.25; nF.push('Ít từ đệm.'); }
    const a1 = cw(p1), a3 = cw(p3);
    out.stats.avgP1 = Math.round(a1); out.stats.avgP3 = Math.round(a3);
    if (p1.length) { if (a1 >= 22) { fc += 0.5; nF.push(`Part 1 trung bình ${Math.round(a1)} từ/câu — mở rộng tốt.`); } else if (a1 < 10) { fc -= 0.5; nF.push(`Part 1 trung bình chỉ ${Math.round(a1)} từ/câu — hãy trả lời dài hơn (2–3 câu + lý do).`); } }
    if (p3.length) { if (a3 >= 45) { fc += 0.5; nF.push(`Part 3 trung bình ${Math.round(a3)} từ/câu — phát triển ý tốt.`); } else if (a3 < 20) { fc -= 0.5; nF.push(`Part 3 trung bình ${Math.round(a3)} từ/câu — cần giải thích, lập luận sâu hơn.`); } }
    const lk = SPOKEN_LINKERS.reduce((a, f) => a + countRx(text, new RegExp('\\b' + rxEsc(f) + '\\b', 'g')), 0);
    if (lk / wc * 100 >= 3) { fc += 0.25; nF.push('Dùng từ nối/diễn đạt liên kết tốt.'); }
  }
  if (voiced > 5) {
    const ppm = pauses / (voiced / 60);
    if (ppm > 14) { fc -= 0.5; nF.push(`Ngắt nghỉ dài khá thường xuyên (~${Math.round(ppm)} lần/phút nói).`); }
    if (longest > 4) { fc -= 0.5; nF.push(`Có khoảng lặng dài ${longest.toFixed(1)} giây.`); }
  }
  out.bands.FC = clamp(halfStep(fc), 4, 7.5);

  /* ---- LR / GRA cần bản ghi chữ ---- */
  if (hasASR) {
    const types = new Set(words), gui = types.size / Math.sqrt(wc);
    out.stats.guiraud = +gui.toFixed(1);
    let lr = gui >= 6.2 ? 7 : gui >= 5.5 ? 6.5 : gui >= 4.8 ? 6 : gui >= 4.2 ? 5.5 : 5; const nL = out.notes.LR;
    nL.push(`Độ đa dạng từ (Guiraud) = ${gui.toFixed(1)} trên ${wc} từ.`);
    if (wc < 120) { lr = Math.min(lr, 5.5); nL.push('Lượng lời nói còn ít để đánh giá vốn từ.'); }
    const idioms = IDIOMS.filter(x => text.includes(x));
    const acad = ACADEMIC_WORDS.filter(w => new RegExp('\\b' + rxEsc(w), 'i').test(text));
    const longShare = words.filter(w => w.length >= 8).length / wc;
    if (acad.length >= 3) { lr += 0.5; nL.push(`Dùng từ vựng nâng cao: ${acad.slice(0, 4).join(', ')}.`); } else nL.push('Nên dùng thêm từ vựng chính xác, ít phổ biến hơn.');
    if (idioms.length) { lr += 0.25; nL.push(`Có cụm/thành ngữ tự nhiên: ${idioms.slice(0, 3).join(', ')}.`); }
    if (longShare >= 0.12) lr += 0.25;
    out.bands.LR = clamp(halfStep(lr), 4, 7.5);

    let gra = 5.5; const nG = out.notes.GRA;
    const sub = SUBORDINATORS.reduce((a, f) => a + countRx(text, new RegExp('\\b' + rxEsc(f) + '\\b', 'g')), 0), subR = sub / wc * 100;
    if (subR >= 6) { gra += 1; nG.push('Dùng nhiều mệnh đề phụ (because, which, if, although…).'); } else if (subR >= 3.5) { gra += 0.5; nG.push('Có dùng mệnh đề phụ.'); } else if (subR < 1.5) { gra -= 0.5; nG.push('Ít cấu trúc câu phức — hãy nối ý bằng because/which/although/if.'); }
    const tenses = [/\b(was|were|did|went|had|\w+ed)\b/, /\b(will|going to|would)\b/, /\b(have|has|had) (\w+ed|been|done|gone|seen|made|taken|lived|worked|studied)\b/, /\bif\b[^.]*\b(would|could|might)\b/].filter(r => r.test(text)).length;
    if (tenses >= 3) { gra += 0.5; nG.push('Dùng được nhiều thì/cấu trúc (quá khứ, tương lai, hoàn thành, điều kiện).'); } else nG.push('Hãy thể hiện thêm nhiều thì: quá khứ, hiện tại hoàn thành, tương lai, câu điều kiện.');
    let gErr = 0; const gram = [];
    GRAMMAR_PATTERNS.forEach(p => { if (p.re.flags.includes('g') && p.re.source.startsWith('\\bi\\b')) return; const m = text.match(new RegExp(p.re.source, 'gi')); if (m) { gErr += m.length; gram.push({ tip: p.tip, ex: m[0] }); } });
    const er = gErr / wc * 100;
    if (er >= 3) { gra -= 1; } else if (er >= 1.5) { gra -= 0.5; } else if (gErr === 0) { gra += 0.25; }
    nG.push(gErr ? `Phát hiện ${gErr} lỗi mẫu (từ bản ghi chữ; trình nhận dạng thường tự sửa ngữ pháp nên số liệu có thể thấp hơn thực tế).` : 'Không phát hiện lỗi mẫu thường gặp (chỉ là gợi ý).');
    out.grammar = gram; out.bands.GRA = clamp(halfStep(gra), 4, 7.5);

    /* ---- P ---- */
    const confs = sc.flatMap(a => a.confs || []);
    if (confs.length >= 3) {
      const c = confs.reduce((a, b) => a + b, 0) / confs.length; out.stats.conf = +c.toFixed(2);
      out.bands.P = c >= 0.94 ? 7.5 : c >= 0.9 ? 7 : c >= 0.85 ? 6.5 : c >= 0.78 ? 6 : c >= 0.7 ? 5.5 : 5;
      out.notes.P.push(`Độ tin cậy nhận dạng giọng nói trung bình ${Math.round(c * 100)}% — dùng làm chỉ báo thô về độ rõ ràng.`);
      out.notes.P.push('Đây KHÔNG phải đánh giá phát âm thật (trọng âm, ngữ điệu, âm cuối). Hãy nhờ giáo viên nghe bản ghi âm.');
    } else out.notes.P.push('Chưa đủ dữ liệu nhận dạng để ước lượng phát âm — hãy tự chấm hoặc nhờ giáo viên.');
  } else {
    out.notes.LR.push('Không có bản ghi chữ (trình duyệt không hỗ trợ nhận dạng giọng nói hoặc micro bị chặn) — hãy tự chấm bằng bảng tiêu chí.');
    out.notes.GRA.push('Không có bản ghi chữ để phân tích.'); out.notes.P.push('Cần tự chấm / nhờ giáo viên nghe bản ghi âm.');
  }
  const vals = Object.values(out.bands).filter(v => v != null);
  out.overall = hasASR && vals.length >= 3 ? roundBand(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
  return out;
}

function finishSpeaking() {
  const analysis = analyzeSpeaking(S.answers);
  LastSpeaking = { answers: S.answers.map(a => ({ part: a.part, q: a.q, url: a.url, dur: a.dur })), set: S.set.id };
  const entry = Hist.add({
    skill: 'S', title: 'Speaking — ' + S.set.title, mode: 'exam', band: analysis.overall, auto: true, analysis,
    answers: S.answers.map(a => ({ part: a.part, q: a.q, dur: a.dur, text: a.text, conf: a.confs && a.confs.length ? +(a.confs.reduce((x, y) => x + y, 0) / a.confs.length).toFixed(2) : null, voicedMs: a.voicedMs, pauses: a.pauses })),
    dur: Math.round((Date.now() - S.startedAt) / 1000)
  });
  afterSkill(entry);
}

/* ==== app-results.js ==== */
/* =====================================================================
   KẾT QUẢ: Listening/Reading (xem lại từng câu), Writing, Speaking,
   bảng tự chấm theo tiêu chí quốc tế, tổng kết Full Mock Test
   ===================================================================== */
const Full = { active: false, order: ['L', 'R', 'W', 'S'], idx: 0, ids: {} };

function afterSkill(entry) {
  if (Full.active) Full.ids[entry.skill] = entry.id;
  showResult(entry);
}

function nextFullButton() {
  if (!Full.active) return null;
  const k = Full.order[Full.idx + 1];
  return h('button', {
    class: 'btn accent lg', type: 'button', text: k ? `Tiếp tục: ${SKILL_NAME[k]} →` : 'Xem tổng kết Full Mock Test →',
    onclick: () => { Full.idx++; runFullStep(); }
  });
}
function startFull() {
  Full.active = true; Full.idx = 0; Full.ids = {};
  runFullStep();
}
function runFullStep() {
  const k = Full.order[Full.idx];
  if (!k) return fullSummary();
  const rnd = n => Math.floor(Math.random() * n);
  if (k === 'L') startListening({ mode: 'exam', scope: 'all' });
  else if (k === 'R') startReading({ scope: 'all' });
  else if (k === 'W') startWriting({ scope: 'full', t1: rnd(WRITING_T1.length), t2: rnd(WRITING_T2.length) });
  else startSpeaking({ set: rnd(SPEAKING_SETS.length), auto: true });
}
function fullSummary() {
  const es = {}; Hist.all().forEach(e => { Object.values(Full.ids).includes(e.id) && (es[e.skill] = e); });
  const bands = ['L', 'R', 'W', 'S'].map(k => es[k] ? es[k].band : null);
  const ov = bands.every(b => b != null) ? overallBand(bands) : overallBand(bands.filter(b => b != null));
  const entry = Hist.add({ skill: 'F', title: 'Full Mock Test', band: ov, parts: bands });
  Full.active = false;
  const node = h('div', { class: 'wrap' },
    h('div', { class: 'card' }, h('div', { class: 'result-hero' }, gaugeEl(ov, 'Overall'),
      h('div', {}, h('h1', { text: 'Kết quả Full Mock Test' }), h('p', { class: 'muted', text: 'Overall = trung bình 4 kỹ năng, làm tròn theo quy tắc IELTS (0.25 → 0.5; 0.75 → 1.0). Writing và Speaking là điểm ước lượng/tự chấm.' }),
        h('div', { class: 'stats' }, ['L', 'R', 'W', 'S'].map((k, i) => h('div', { class: 'stat' }, h('b', { text: fmtBand(bands[i]) }), h('span', { text: SKILL_NAME[k] }))))))),
    h('div', { class: 'spacer' }), adviceCard(['L', 'R', 'W', 'S'], bands),
    h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn accent', type: 'button', text: 'Về trang chủ', onclick: homeView }), h('button', { class: 'btn ghost', type: 'button', text: 'Xem lịch sử', onclick: historyView })));
  View.mount(node); Top.set({ title: 'Tổng kết', items: navButtons() });
}
function adviceCard(keys, bands) {
  const valid = keys.map((k, i) => ({ k, b: bands[i] })).filter(x => x.b != null).sort((a, b) => a.b - b.b);
  const tips = { L: 'Luyện nghe chép chính tả, đọc trước câu hỏi để đoán từ loại, chú ý bẫy sửa lời (… sorry, …).', R: 'Luyện skimming/scanning, quản lý 20 phút/bài, đối chiếu từng ý với đoạn văn để phân biệt False và Not Given.', W: 'Luyện cấu trúc bài (Overview ở Task 1; quan điểm rõ + ví dụ ở Task 2), đa dạng câu phức và từ nối, soát lỗi chính tả.', S: 'Luyện nói đủ 2 phút ở Part 2, mở rộng câu trả lời Part 1 bằng lý do + ví dụ, giảm từ đệm, ghi âm và nghe lại.' };
  if (!valid.length) return h('div', {});
  return h('div', { class: 'card' }, h('h3', { text: 'Gợi ý ưu tiên' }),
    h('ul', { style: { margin: 0, paddingLeft: '18px', lineHeight: 1.8 } }, valid.slice(0, 2).map(x => h('li', {}, h('b', { text: `${SKILL_NAME[x.k]} (${fmtBand(x.b)}): ` }), tips[x.k]))));
}

function showResult(entry) {
  const body = entry.skill === 'W' ? resultWriting(entry) : entry.skill === 'S' ? resultSpeaking(entry) : resultObjective(entry);
  const acts = h('div', { class: 'row no-print', style: { marginTop: '18px' } },
    nextFullButton(),
    h('button', { class: 'btn ' + (Full.active ? 'ghost' : 'accent'), type: 'button', text: 'Về trang chủ', onclick: homeView }),
    h('button', { class: 'btn ghost', type: 'button', text: 'In / lưu PDF', onclick: () => window.print() }));
  View.mount(h('div', { class: 'wrap' }, body, acts));
  Top.set({ title: 'Kết quả — ' + SKILL_NAME[entry.skill], items: navButtons() });
}

/* ---------------- LISTENING / READING ---------------- */
function resultObjective(entry) {
  const isL = entry.skill === 'L';
  const test = (isL ? LISTENING_TESTS : READING_TESTS).find(t => t.id === entry.ref.test) || (isL ? LISTENING_TESTS : READING_TESTS)[0];
  const parts = isL ? entry.ref.secs.map(i => test.sections[i]) : entry.ref.ps.map(i => test.passages[i]);
  const pct = Math.round(entry.raw / entry.total * 100);
  const hero = h('div', { class: 'card' }, h('div', { class: 'result-hero' }, gaugeEl(entry.band, entry.estimated ? 'Ước lượng' : 'Band'),
    h('div', {}, h('h1', { text: entry.title }), h('p', { class: 'muted', text: fmtDate(entry.ts) + ' · ' + (entry.mode === 'exam' ? 'Chế độ thi thật' : 'Chế độ luyện tập') }),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', { text: `${entry.raw}/${entry.total}` }), h('span', { text: 'Số câu đúng' })),
        h('div', { class: 'stat' }, h('b', { text: pct + '%' }), h('span', { text: 'Tỉ lệ đúng' })),
        h('div', { class: 'stat' }, h('b', { text: fmtTime(entry.dur || 0) }), h('span', { text: 'Thời gian làm' })),
        h('div', { class: 'stat' }, h('b', { text: fmtBand(entry.band) }), h('span', { text: entry.estimated ? 'Band quy đổi theo tỉ lệ' : 'Band quốc tế' }))),
      entry.estimated ? h('p', { class: 'notice small', style: { marginTop: '12px' }, text: 'Bạn chỉ làm một phần của bài thi nên band được quy đổi theo tỉ lệ (ước lượng). Làm đủ 40 câu để có band chính xác theo bảng quy đổi.' }) : null)));

  const typeRows = Object.entries(entry.byType || {}).map(([t, v]) => h('tr', {}, h('td', { text: TYPE_LABEL[t] || t }), h('td', { text: `${v.c}/${v.t}` }),
    h('td', { style: { minWidth: '140px' } }, h('div', { class: 'bar' }, h('i', { style: { width: Math.round(v.c / v.t * 100) + '%' } })))));
  const analysis = h('div', { class: 'card', style: { marginTop: '16px' } }, h('h3', { text: 'Phân tích theo dạng câu hỏi' }),
    h('table', { class: 'grid2' }, h('thead', {}, h('tr', {}, h('th', { text: 'Dạng câu' }), h('th', { text: 'Đúng' }), h('th', { text: '' }))), h('tbody', {}, typeRows)));

  const review = h('div', { style: { marginTop: '18px' } }, h('h2', { text: 'Xem lại đáp án' }),
    h('p', { class: 'muted small', text: 'Ô xanh = đúng, ô đỏ = sai (kèm đáp án đúng). Đáp án điền từ phải đúng chính tả.' }));
  parts.forEach((p, idx) => {
    review.append(h('h3', { text: isL ? p.title + ' — ' + p.topic : 'Passage ' + (entry.ref.ps[idx] + 1) + ': ' + p.title, style: { marginTop: '20px' } }));
    if (isL) review.append(h('details', {}, h('summary', { text: 'Lời thoại (transcript)' }), h('div', { class: 'transcript' }, p.script.map(l => h('p', {}, h('span', { class: 'sp', text: (p.speakers[l.s] || {}).name || '' }), l.t)))));
    else review.append(h('details', {}, h('summary', { text: 'Bài đọc' }), h('article', { class: 'passage' }, p.paras.map(x => h('p', {}, h('span', { class: 'pl', text: x.l }), x.t)))));
    review.append(renderBlocks(p.blocks, { ans: entry.ans || {}, review: { res: entry.res || {} } }));
  });
  const dl = h('button', { class: 'btn ghost sm no-print', type: 'button', text: '⬇ Tải kết quả (.txt)', onclick: () => download(`ket-qua-${entry.skill}-${entry.id}.txt`, objectiveText(entry, parts, isL)) });
  const again = h('button', { class: 'btn ghost sm no-print', type: 'button', text: 'Làm lại bài này', onclick: () => (isL ? listeningSetup : readingSetup)() });
  return h('div', {}, hero, analysis, h('div', { class: 'row', style: { marginTop: '12px' } }, dl, again), review);
}
function objectiveText(entry, parts, isL) {
  const lines = [`${APP_NAME}`, entry.title, fmtDate(entry.ts), `Đúng ${entry.raw}/${entry.total} — Band ${fmtBand(entry.band)}${entry.estimated ? ' (ước lượng)' : ''}`, ''];
  parts.forEach(p => flatten(p.blocks).forEach(q => { const ok = entry.res[q.n]; lines.push(`${String(q.n).padStart(2, ' ')}. ${ok ? 'ĐÚNG' : 'SAI '}  Bạn: ${(entry.ans || {})[q.n] || '(trống)'}  |  Đáp án: ${Array.isArray(q.answer) ? q.answer[0] : q.answer}`); }));
  lines.push('', COPYRIGHT, 'ĐT: ' + PHONE_FMT);
  return lines.join('\n');
}

/* ---------------- Bảng tự chấm dùng chung ---------------- */
function bandOptions() { const o = []; for (let b = 3; b <= 9; b += 0.5) o.push(b); return o; }
function descFor(list, k, band) { const c = list.find(x => x.k === k); if (!c) return ''; const f = clamp(Math.floor(band), 4, 9); return c.d[f] || ''; }

function selfPanel(entry, groups, combine) {
  /* groups: [{id,title,crit:[{k,name,d}], init:{k:band}}] */
  const st = {}; groups.forEach(g => { st[g.id] = Object.assign({}, g.init); });
  if (entry.self) Object.keys(entry.self).forEach(gid => { if (st[gid]) Object.assign(st[gid], entry.self[gid]); });
  const out = h('b', { text: '—', style: { fontSize: '30px', color: 'var(--accent-ink)' } });
  const compute = () => {
    const gb = groups.map(g => { const v = g.crit.map(c => st[g.id][c.k]).filter(x => x != null); return v.length ? roundBand(v.reduce((a, b) => a + b, 0) / v.length) : null; });
    const fin = combine(gb); out.textContent = fmtBand(fin); return { gb, fin };
  };
  const wrap = h('div', { class: 'card', style: { marginTop: '16px' } },
    h('h3', { text: 'Tự chấm / giáo viên chấm theo tiêu chí quốc tế' }),
    h('p', { class: 'muted small', text: 'Chọn band cho từng tiêu chí và đối chiếu với mô tả. Band cuối cùng sẽ được lưu vào lịch sử và dùng cho tổng kết.' }));
  groups.forEach(g => {
    wrap.append(h('h4', { text: g.title, style: { marginTop: '12px' } }));
    const grid = h('div', { class: 'selfgrid' });
    g.crit.forEach(c => {
      const desc = h('div', { class: 'small muted' });
      const sel = h('select', { 'aria-label': g.title + ' ' + c.name, onchange: e => { st[g.id][c.k] = Number(e.target.value); desc.textContent = descFor(g.crit, c.k, st[g.id][c.k]); compute(); } },
        bandOptions().map(b => h('option', { value: b, text: fmtBand(b) })));
      if (st[g.id][c.k] == null) st[g.id][c.k] = 6;
      sel.value = st[g.id][c.k]; desc.textContent = descFor(g.crit, c.k, st[g.id][c.k]);
      grid.append(h('div', { class: 'c' }, h('b', { text: c.name }), sel, desc));
    });
    wrap.append(grid);
  });
  wrap.append(h('div', { class: 'row', style: { marginTop: '14px' } }, h('span', { text: 'Band của bạn: ' }), out,
    h('button', { class: 'btn accent', type: 'button', text: 'Lưu band tự chấm', onclick: () => { const { fin } = compute(); Hist.update(entry.id, { band: fin, self: st, selfAssessed: true }); entry.band = fin; toast('Đã lưu band ' + fmtBand(fin)); } })));
  compute();
  return wrap;
}

function critCards(list, bands, notes) {
  return h('div', { class: 'crit' }, list.map(c => h('div', { class: 'c' },
    h('h4', {}, h('span', { text: c.name }), h('span', { class: 'b', text: fmtBand(bands[c.k]) })),
    h('ul', {}, (notes[c.k] || []).map(t => h('li', { text: t }))))));
}
const AUTO_WARN = 'Điểm tự động dưới đây là ƯỚC LƯỢNG dựa trên đặc điểm văn bản/giọng nói (độ dài, từ nối, đa dạng từ vựng, câu phức, một số lỗi mẫu…). Sai số có thể ±1.0 band và không thay thế giám khảo thật. Hãy đối chiếu bằng bảng tự chấm bên dưới hoặc nhờ giáo viên chấm.';

function describeChart(t1) {

}
function copyText(t) {

/* ---------------- LỊCH SỬ ---------------- */
function historyChart(all) {
  const W_ = 720, H_ = 260, m = { l: 40, r: 16, t: 16, b: 30 };
  const iw = W_ - m.l - m.r, ih = H_ - m.t - m.b;
  const chron = all.filter(e => e.band != null && ['L', 'R', 'W', 'S'].includes(e.skill)).slice().reverse();
  if (chron.length < 2) return null;
  const y = b => m.t + ih - ((b - 3) / 6) * ih, n = chron.length, x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  let s = `<svg class="hist-chart" viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Biểu đồ tiến bộ band" font-family="system-ui,Arial,sans-serif">`;
  for (let b = 3; b <= 9; b++) s += `<line x1="${m.l}" x2="${W_ - m.r}" y1="${y(b)}" y2="${y(b)}" stroke="var(--line)"/><text x="${m.l - 8}" y="${y(b) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${b}</text>`;
  ['L', 'R', 'W', 'S'].forEach(k => {
    const pts = chron.map((e, i) => e.skill === k ? [x(i), y(e.band)] : null).filter(Boolean);
    if (!pts.length) return;
    if (pts.length > 1) s += `<polyline fill="none" stroke="${SKILL_COLOR[k]}" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    pts.forEach(p => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${SKILL_COLOR[k]}"/>`; });
  });
  s += '</svg>';
  return h('div', {}, h('div', { class: 'row small', style: { marginBottom: '6px' } }, ['L', 'R', 'W', 'S'].map(k => h('span', { html: `<b style="color:${SKILL_COLOR[k]}">●</b> ${SKILL_NAME[k]}` }))), h('div', { html: s }));
}

        h('button', { class: 'btn danger sm', type: 'button', text: 'Xoá toàn bộ lịch sử', onclick: async () => { if (await confirmBox('Xoá lịch sử?', 'Toàn bộ kết quả đã lưu trên máy này sẽ bị xoá và không thể khôi phục.', 'Xoá', 'Giữ lại')) { Hist.clear(); historyView(); } } }))),
